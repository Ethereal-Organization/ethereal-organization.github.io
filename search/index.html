<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Temporarily Down</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        .down-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            animation: fadeSlideUp 0.6s ease forwards;
        }

        .down-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounceBadge 1s ease infinite;
            color: var(--primary-accent);
        }

        .down-title {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--text-color);
        }

        .down-subtitle {
            font-size: 1.2em;
            color: var(--dim-text);
            margin-bottom: 30px;
        }

        .retry-button, .summon-button {
            padding: 12px 24px;
            font-size: 1em;
            border-radius: var(--border-radius);
            background: linear-gradient(135deg, #2c323c, #1b1f28);
            color: var(--primary-accent);
            border: 1px solid var(--primary-accent);
            cursor: pointer;
            box-shadow: 0 0 8px rgba(88, 166, 255, 0.4);
            transition: background 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease;
            margin: 10px;
        }

        .retry-button:hover, .summon-button:hover {
            background: linear-gradient(135deg, #58a6ff, #1e2a4d);
            color: white;
            transform: scale(1.05);
            box-shadow: 0 0 12px 2px var(--primary-accent);
        }

        .retry-button:active, .summon-button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="down-wrapper">
        <div class="down-icon">⚠️</div>
        <div class="down-title">Temporarily Down</div>
        <div class="down-subtitle">The Omega Threat Archive has temporarily went offline. Check back later.</div>
    </div>
</body>
</html>
